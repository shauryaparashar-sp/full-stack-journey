<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Content Hub</title>

</head>

<body>

    <!-- Website Header -->
    <header>

        <h1>CONTENT HUB</h1>

        <p>A collection of videos and audios</p>

    </header>

    <main>

        <!-- ==================== VIDEOS ==================== -->

        <section id="videos">

            <h2>Videos</h2>

            <section>

                <!-- Ocean Videos -->
                <h3>Ocean</h3>

                <video src="ocean1.mp4" controls height="200"> </video>

                <video src="ocean2.mp4" controls height="200"> </video>

                <video src="ocean3.mp4" controls height="200"> </video>

                <video src="ocean4.mp4" controls height="200"> </video>

            </section>

             <section>

                <!-- Space videos -->
                <h3>Space</h3>

                <video src="space1.mp4" controls height="200"> </video>

                <video src="space2.mp4" controls height="200"> </video>

                <video src="space3.mp4" controls height="200"> </video>

                <video src="space4.mp4" controls height="200"> </video>

            </section>

            <section>

                <!-- Forest videos -->
                <h3>Forest</h3>

                <video src="forest1.mp4" controls height="200"> </video>

                <video src="forest2.mp4" controls height="200"> </video>

                <video src="forest3.mp4" controls height="200"> </video>

                <video src="forest4.mp4" controls height="200"> </video>

            </section>

        </section>

               <!-- ==================== Audios ==================== -->

        <section id="audios">

            <h2>Audios</h2>

            <section>

                <!-- Instrumental Audios -->

                <audio src="ins1.mp3" controls></audio>

                <audio src="ins2.mp3" controls></audio>

                <audio src="ins3.mp3" controls></audio>

                <audio src="ins4.mp3" controls></audio>

            </section>

            <section>

                <!-- Sound effects Audios -->
                <h3>Sound effects</h3>

                <audio src="se1.mp3" controls></audio>

                <audio src="se2.mp3" controls></audio>

                <audio src="se3.mp3" controls></audio>

                <audio src="se4.mp3" controls></audio>

            </section>

        </section>

    </main>

</body>

</html>

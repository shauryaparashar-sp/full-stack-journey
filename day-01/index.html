<!DOCTYPE html>
<!-- Day 1: Basic HTML page linked with an external CSS and JS file -->
<html lang="en">
<head>
    <!-- Character encoding so all text/symbols display correctly -->
    <meta charset="UTF-8">
    <!-- Makes the page scale properly on mobile screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Text shown on the browser tab -->
    <title>DAY 1 OF LEARNING FULLSTACK</title>
    <!-- Linking external CSS file for styling -->
    <link rel="stylesheet" href="style.css">
</head>  
<body>
    <!-- Main content of the page: intro message for my fullstack journey -->
    This is my first day of learning fullstack development. I am excited to start this journey and learn new skills in web development. I will be focusing on both front-end and back-end technologies to become a proficient fullstack developer.

    <!-- Linking external JS file (placed at the end of body so HTML loads first) -->
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Specificity & Cascade</title>
    <style>
        h1{
            color:blueviolet
        }
        .yellow{
            color:brown
        }
        .cred{
            color:darkgreen
        }
        .cpurple{
            color:darkmagenta
        }
        
        /* Attribute selector */
        [data-x=a]{
            background-color: blanchedalmond;
        }
    </style>
</head>
<body>
    <div>
        <h1 class="yellow cred cpurple" data-x="a">CSS Specificity</h1>
    </div>
</body>
</html>

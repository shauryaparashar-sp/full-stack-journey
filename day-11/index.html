<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Element Selector */
        div {
            /* background-color:cadetblue; */
        }

        /* Class Selector */
        .bisque {
            background-color: bisque;
        }

        /* id Selector */
        #green {
            background-color: green;
        }

        /* Child Selector */
        div>p {
            color: brown;
        }

        /* Universal Selector */
        *{
            margin:0;
            padding:0;
        }
    </style>
</head>

<body>

    <div class="bisque">
        I am a div
        <p>I am a Child Selector</p>
    </div>

    <div id="green">
        I am another div
    </div>

</body>

</html>

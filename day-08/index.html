<!-- Id and Classes in HTML -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id and Classes in HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Classes can be same but Id cannot be similar -->
    <div id="Student1" class="pink bg-yellow">First Id</div></div>

    <div id="Student2">Second Id</div>

    <span class="pink"></span>

</body>
</html>

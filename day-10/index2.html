<!-- ============ Inline, Internal & External CSS ============ -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline, Internal & External CSS</title>

    <!-- Internal CSS -->
    <style>
        h2{
            background-color: rgb(62, 155, 112);
        }
    </style>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Inline CSS -->
    <h1 style="color: goldenrod; background-color: brown;">Inline, Internal & External CSS</h1>

    <div>
        <ol>      

            <!-- Inline CSS -->
           <li><h2 style="color: white">Inline CSS</h2></li>

           <!-- Internal CSS -->
            <li><h2>Internal CSS</h2></li>

        </ol>
    </div>

    <!-- External CSS -->
    <p> Lorem ipsum dolor sit amet consectetur adipisicing elit. Aperiam sint velit dicta culpa, harum corporis quidem et veniam laboriosam. Et!</p>

</body>
</html>

<!-- Practice code -->
<!-- Learning how to add image, table and list -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Adding image -->
    <img height="300" src="car.png" alt="Car image">

    <!-- Creating table -->
    <table>
        <tr> 
            <th>Object</th>
            <th>Model</th>
            <th>Place</th>
        </tr>
        <tr>
            <td>Car</td>
            <td>xyz</td>
            <td>India</td>
        </tr>
    </table>

    <!-- Creating list -->
     <!-- Unordered list -->
     <ul>
        <li>Car</li>
        <li>Bike</li>
        <li>Aeroplane</li>
     </ul>

     <!-- Ordered list -->
     <ol>
        <li>Car</li>
        <li>Bike</li>
        <li>Aeroplane</li>
     </ol>

</body>
</html>
